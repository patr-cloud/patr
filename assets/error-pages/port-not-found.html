<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Port Not Available</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://assets.patr.cloud/error-pages/index.css">
</head>

<body>

  <div class="bg-stars" id="stars">
    <img src="https://assets.patr.cloud/error-pages/starry-sky.svg" alt="">
  </div>

  <img src="https://assets.patr.cloud/error-pages/astronaut.svg" alt="" class="space-asset astronaut">
  <img src="https://assets.patr.cloud/error-pages/planet.svg" alt="" class="space-asset planet-tr">
  <img src="https://assets.patr.cloud/error-pages/planet.svg" alt="" class="space-asset planet-tl">
  <img src="https://assets.patr.cloud/error-pages/spaceship.svg" alt="" class="space-asset spaceship">
  <img src="https://assets.patr.cloud/error-pages/patr-lowercase.png" alt="Patr" class="logo">

  <section class="card">
    <div class="status-code">404</div>
    <h1>Port Not Available</h1>
    <p class="description">
      The port you're trying to reach is not exposed on this deployment.
      If you're the site owner, check the exposed ports in your deployment configuration.
    </p>
    <hr class="separator">
    <p class="help">
      Need help? <a href="https://app.patr.cloud">Go to Dashboard</a>
    </p>
  </section>

  <script src="https://assets.patr.cloud/error-pages/index.js"></script>
</body>

</html>
