type: Deployment
name: "Grafana"
image:
  registry: 'docker.io'
  repository: 'grafana/grafana-oss'
  tag: 'latest'
# "grafana/grafana-oss:12"
runner: "Test runner"
machineType:
  cpu: '2vCPU'
  ram: '4GB RAM'
# "2vCPU 4GB"
deploy_on_push: true
min_horizontal_scale: 1
max_horizontal_scale: 1
ports:
  "3000":
   http: ~
