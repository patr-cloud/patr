type: Deployment
name: "Grafana"
image: "grafana/grafana-oss:12"
runner: "test-runner"
machine_type: "2vCPU 4GB"
deploy_on_push: true
min_horizontal_scale: 1
max_horizontal_scale: 1
ports:
  3000: http
env:
  GF_PATHS_CONFIG: /etc/grafana/grafana.ini
  GF_PATHS_DATA: /var/lib/grafana
  GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
configs:
  "/etc/grafana/grafana.ini": "../config/grafana.ini"
