[package]
name = "common"

authors.workspace      = true
autotests              = false
description.workspace  = true
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[build-dependencies]
build-print = { workspace = true }
flate2      = { workspace = true, features = ["default"] }
futures     = { workspace = true, features = ["default"] }
reqwest     = { workspace = true, features = ["blocking", "rustls", "stream"] }
tar         = { workspace = true, features = ["default"] }

[dependencies]
argon2                         = { workspace = true, features = ["default"] }
axum                           = { workspace = true, features = ["default", "macros", "tracing"] }
axum-extra                     = { workspace = true, features = ["default", "typed-routing"] }
base64                         = { workspace = true, features = ["default"] }
config                         = { workspace = true, features = ["json"] }
console-subscriber             = { workspace = true, features = ["default"] }
fslock                         = { workspace = true, features = ["default"] }
futures                        = { workspace = true }
http                           = { workspace = true, features = ["default"] }
inventory                      = { workspace = true, features = [] }
jsonwebtoken                   = { workspace = true, features = ["aws_lc_rs", "default"] }
macros                         = { workspace = true }
models                         = { workspace = true }
opentelemetry                  = { workspace = true, features = ["default"] }
opentelemetry-appender-tracing = { workspace = true, features = ["default"] }
opentelemetry-otlp             = { workspace = true, features = ["default", "http-json", "reqwest-rustls-webpki-roots"] }
opentelemetry_sdk              = { workspace = true, features = ["default", "rt-tokio"] }
preprocess                     = { workspace = true, features = [] }
ractor                         = { workspace = true, features = ["tokio_runtime"] }
ractor_actors                  = { workspace = true, features = ["streams"] }
rand                           = { workspace = true, features = ["default"] }
reqwest                        = { workspace = true, features = ["json", "rustls", "stream"] }
rust-embed                     = { workspace = true, features = ["interpolate-folder-path", "mime-guess"] }
rustls                         = { workspace = true, features = ["ring"] }
semver                         = { workspace = true, features = ["default"] }
serde                          = { workspace = true, features = ["derive"] }
serde_json                     = { workspace = true, features = [] }
serde_qs                       = { workspace = true, features = [] }
sqlx                           = { workspace = true, features = ["runtime-tokio-rustls", "sqlite", "time", "uuid"] }
tempfile                       = { workspace = true, features = ["default"] }
thiserror                      = { workspace = true, features = [] }
time                           = { workspace = true, features = ["default", "serde-human-readable"] }
tokio                          = { workspace = true, features = ["full"] }
tokio-stream                   = { workspace = true, features = ["default", "sync"] }
tokio-tungstenite              = { workspace = true, features = ["default", "rustls-tls-webpki-roots"] }
tokio-util                     = { workspace = true, features = ["rt"] }
tower                          = { workspace = true, features = [] }
tower-http                     = { workspace = true, features = ["fs"] }
tracing                        = { workspace = true, features = ["async-await", "default"] }
tracing-subscriber             = { workspace = true, features = ["default"] }
typed-builder                  = { workspace = true, features = [] }

[dev-dependencies]
axum       = { workspace = true, features = ["default", "ws"] }
axum-extra = { workspace = true, features = ["default", "typed-header", "typed-routing"] }
axum-test  = { workspace = true, features = ["default"] }
headers    = { workspace = true, features = [] }
wiremock   = { workspace = true, features = [] }

[[test]]
name = "integration-tests"
path = "tests/mod.rs"
