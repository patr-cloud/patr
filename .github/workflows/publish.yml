name: Publish

on:
  push:
    branches: [develop, staging, master]

jobs:
  version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.v.outputs.full }}
      major: ${{ steps.v.outputs.major }}
      minor: ${{ steps.v.outputs.minor }}
      short_sha: ${{ steps.v.outputs.short_sha }}
      build_version: ${{ steps.v.outputs.build_version }}
      beta_num: ${{ steps.v.outputs.beta_num }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: v
        run: |
          VERSION=$(grep '^package.version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Channel-specific semver baked into the binary as `PATR_BUILD_VERSION`.
          # Matches the GH release tag scheme:
          #   master  -> 0.18.0
          #   staging -> 0.18.0-beta.N  (N = next unused beta index)
          #   develop -> 0.18.0-alpha.<run_number>
          BETA_NUM=""
          case "${{ github.ref_name }}" in
            master)
              BUILD_VERSION="$VERSION"
              ;;
            staging)
              # Find the next beta number by counting existing beta tags for this version.
              BETA_NUM=1
              while git tag -l "v${VERSION}-beta.${BETA_NUM}" | grep -q .; do
                BETA_NUM=$((BETA_NUM + 1))
              done
              BUILD_VERSION="${VERSION}-beta.${BETA_NUM}"
              ;;
            develop)
              BUILD_VERSION="${VERSION}-alpha.${{ github.run_number }}"
              ;;
          esac

          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "beta_num=$BETA_NUM" >> "$GITHUB_OUTPUT"

      - name: Reject duplicate version on stable
        if: github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.full }}"
          if git tag -l "$TAG" | grep -q "$TAG"; then
            echo "::error::Version $TAG already exists. Bump the version in Cargo.toml before merging to master."
            exit 1
          fi

  build-api:
    name: Build api (${{ matrix.arch }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Compute Docker tags
        id: tags
        run: |
          IMAGE="patrcloud/api"
          BRANCH="${{ github.ref_name }}"
          VERSION_FULL="${{ needs.version.outputs.full }}"
          VERSION_MINOR="${{ needs.version.outputs.minor }}"
          VERSION_MAJOR="${{ needs.version.outputs.major }}"
          ARCH="${{ matrix.arch }}"

          case "$BRANCH" in
            master)
              TAGS="${IMAGE}:${VERSION_MAJOR}-${ARCH},${IMAGE}:${VERSION_MINOR}-${ARCH},${IMAGE}:${VERSION_FULL}-${ARCH},${IMAGE}:latest-${ARCH},${IMAGE}:stable-${ARCH}"
              ;;
            staging)
              TAGS="${IMAGE}:${VERSION_MAJOR}-beta-${ARCH},${IMAGE}:${VERSION_MINOR}-beta-${ARCH},${IMAGE}:${VERSION_FULL}-beta-${ARCH},${IMAGE}:staging-${ARCH},${IMAGE}:beta-${ARCH}"
              ;;
            develop)
              TAGS="${IMAGE}:develop-${ARCH},${IMAGE}:alpha-${ARCH}"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for Docker publishing. Use master, staging, or develop."
              exit 1
              ;;
          esac

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          TAG_FLAGS=""
          for TAG in "${TAG_ARRAY[@]}"; do
            TAG_FLAGS="$TAG_FLAGS -t $TAG"
          done

          docker build $TAG_FLAGS -f api/Dockerfile .
          for TAG in "${TAG_ARRAY[@]}"; do
            docker push "$TAG"
          done

  build-frontend:
    name: Build frontend (${{ matrix.arch }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Compute Docker tags
        id: tags
        run: |
          IMAGE="patrcloud/frontend"
          BRANCH="${{ github.ref_name }}"
          VERSION_FULL="${{ needs.version.outputs.full }}"
          VERSION_MINOR="${{ needs.version.outputs.minor }}"
          VERSION_MAJOR="${{ needs.version.outputs.major }}"
          ARCH="${{ matrix.arch }}"

          case "$BRANCH" in
            master)
              TAGS="${IMAGE}:${VERSION_MAJOR}-${ARCH},${IMAGE}:${VERSION_MINOR}-${ARCH},${IMAGE}:${VERSION_FULL}-${ARCH},${IMAGE}:latest-${ARCH},${IMAGE}:stable-${ARCH}"
              ;;
            staging)
              TAGS="${IMAGE}:${VERSION_MAJOR}-beta-${ARCH},${IMAGE}:${VERSION_MINOR}-beta-${ARCH},${IMAGE}:${VERSION_FULL}-beta-${ARCH},${IMAGE}:staging-${ARCH},${IMAGE}:beta-${ARCH}"
              ;;
            develop)
              TAGS="${IMAGE}:develop-${ARCH},${IMAGE}:alpha-${ARCH}"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for Docker publishing. Use master, staging, or develop."
              exit 1
              ;;
          esac

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          TAG_FLAGS=""
          for TAG in "${TAG_ARRAY[@]}"; do
            TAG_FLAGS="$TAG_FLAGS -t $TAG"
          done

          docker build $TAG_FLAGS \
            --build-arg VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }} \
            --build-arg VITE_BASE_URL=${{ secrets.VITE_BASE_URL }} \
            -f frontend/Dockerfile .
          for TAG in "${TAG_ARRAY[@]}"; do
            docker push "$TAG"
          done

  build-cli-binaries:
    name: Build CLI (${{ matrix.artifact_name }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard binaries — shipped via the curl installer + direct download.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            artifact_name: patr-linux-amd64
            binary_name: patr
            archive_ext: tar.gz
            features: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact_name: patr-linux-arm64
            binary_name: patr
            archive_ext: tar.gz
            features: ""
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact_name: patr-darwin-arm64
            binary_name: patr
            archive_ext: zip
            features: ""
          # Homebrew-tapped binaries — built with `package-managed` so
          # `patr upgrade` and `patr uninstall` hard-refuse. Consumed by the
          # homebrew formula.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            artifact_name: patr-linux-amd64-brew
            binary_name: patr
            archive_ext: tar.gz
            features: package-managed
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact_name: patr-linux-arm64-brew
            binary_name: patr
            archive_ext: tar.gz
            features: package-managed
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact_name: patr-darwin-arm64-brew
            binary_name: patr
            archive_ext: zip
            features: package-managed
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Generate TS bindings
        run: cargo bindings
        env:
          SQLX_OFFLINE: "true"

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build frontend (CSR)
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
        env:
          VITE_BUILD_TARGET: csr

      - name: Build CLI
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release --package cli --locked --features "${{ matrix.features }}"
          else
            cargo build --release --package cli --locked
          fi
        env:
          PATR_BUILD_CHANNEL: ${{ github.ref_name == 'master' && 'stable' || github.ref_name == 'staging' && 'beta' || 'alpha' }}
          PATR_BUILD_SHA: ${{ github.sha }}
          PATR_BUILD_VERSION: ${{ needs.version.outputs.build_version }}

      - name: Package binary (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C target/release ${{ matrix.binary_name }}

      - name: Package binary (zip, macOS)
        if: matrix.archive_ext == 'zip' && runner.os == 'macOS'
        run: zip -j ${{ matrix.artifact_name }}.zip target/release/${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          retention-days: 1

  build-cli-docker:
    name: Build CLI Docker (${{ matrix.arch }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Compute Docker tags
        id: tags
        run: |
          IMAGE="patrcloud/cli"
          BRANCH="${{ github.ref_name }}"
          VERSION_FULL="${{ needs.version.outputs.full }}"
          VERSION_MINOR="${{ needs.version.outputs.minor }}"
          VERSION_MAJOR="${{ needs.version.outputs.major }}"
          ARCH="${{ matrix.arch }}"
          SHORT_SHA="${{ needs.version.outputs.short_sha }}"

          case "$BRANCH" in
            master)
              TAGS="${IMAGE}:${VERSION_MAJOR}-${ARCH},${IMAGE}:${VERSION_MINOR}-${ARCH},${IMAGE}:${VERSION_FULL}-${ARCH},${IMAGE}:latest-${ARCH},${IMAGE}:stable-${ARCH}"
              ;;
            staging)
              TAGS="${IMAGE}:${VERSION_MAJOR}-beta-${ARCH},${IMAGE}:${VERSION_MINOR}-beta-${ARCH},${IMAGE}:${VERSION_FULL}-beta-${ARCH},${IMAGE}:staging-${ARCH},${IMAGE}:beta-${ARCH}"
              ;;
            develop)
              TAGS="${IMAGE}:develop-${ARCH},${IMAGE}:alpha-${ARCH},${IMAGE}:alpha.${SHORT_SHA}-${ARCH}"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for Docker publishing. Use master, staging, or develop."
              exit 1
              ;;
          esac

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          TAG_FLAGS=""
          for TAG in "${TAG_ARRAY[@]}"; do
            TAG_FLAGS="$TAG_FLAGS -t $TAG"
          done

          CHANNEL="${{ github.ref_name == 'master' && 'stable' || github.ref_name == 'staging' && 'beta' || 'alpha' }}"

          docker build $TAG_FLAGS \
            --build-arg PATR_BUILD_CHANNEL=$CHANNEL \
            --build-arg PATR_BUILD_SHA=${{ github.sha }} \
            -f cli/Dockerfile .
          for TAG in "${TAG_ARRAY[@]}"; do
            docker push "$TAG"
          done

  manifest-api:
    name: Multi-arch manifest for api
    needs: [version, build-api]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Create and push multi-arch manifests
        run: |
          IMAGE="patrcloud/api"
          BRANCH="${{ github.ref_name }}"
          VERSION_FULL="${{ needs.version.outputs.full }}"
          VERSION_MINOR="${{ needs.version.outputs.minor }}"
          VERSION_MAJOR="${{ needs.version.outputs.major }}"

          case "$BRANCH" in
            master)
              BASE_TAGS="${VERSION_MAJOR} ${VERSION_MINOR} ${VERSION_FULL} latest stable"
              ;;
            staging)
              BASE_TAGS="${VERSION_MAJOR}-beta ${VERSION_MINOR}-beta ${VERSION_FULL}-beta staging beta"
              ;;
            develop)
              BASE_TAGS="develop alpha"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for Docker publishing. Use master, staging, or develop."
              exit 1
              ;;
          esac

          for TAG in $BASE_TAGS; do
            docker manifest create "${IMAGE}:${TAG}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
            docker manifest push "${IMAGE}:${TAG}"
          done

  manifest-frontend:
    name: Multi-arch manifest for frontend
    needs: [version, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Create and push multi-arch manifests
        run: |
          IMAGE="patrcloud/frontend"
          BRANCH="${{ github.ref_name }}"
          VERSION_FULL="${{ needs.version.outputs.full }}"
          VERSION_MINOR="${{ needs.version.outputs.minor }}"
          VERSION_MAJOR="${{ needs.version.outputs.major }}"

          case "$BRANCH" in
            master)
              BASE_TAGS="${VERSION_MAJOR} ${VERSION_MINOR} ${VERSION_FULL} latest stable"
              ;;
            staging)
              BASE_TAGS="${VERSION_MAJOR}-beta ${VERSION_MINOR}-beta ${VERSION_FULL}-beta staging beta"
              ;;
            develop)
              BASE_TAGS="develop alpha"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for Docker publishing. Use master, staging, or develop."
              exit 1
              ;;
          esac

          for TAG in $BASE_TAGS; do
            docker manifest create "${IMAGE}:${TAG}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
            docker manifest push "${IMAGE}:${TAG}"
          done

  deploy:
    name: Deploy to alpha server
    needs: [manifest-api, manifest-frontend]
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop'
    steps:
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.SERVER_SSH_USER }}@${{ secrets.SERVER_IP_ADDRESS }} "./update.sh"
          rm private_key.pem

  manifest-cli:
    name: Multi-arch manifest for CLI
    needs: [version, build-cli-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Create and push multi-arch manifests
        run: |
          IMAGE="patrcloud/cli"
          BRANCH="${{ github.ref_name }}"
          VERSION_FULL="${{ needs.version.outputs.full }}"
          VERSION_MINOR="${{ needs.version.outputs.minor }}"
          VERSION_MAJOR="${{ needs.version.outputs.major }}"
          SHORT_SHA="${{ needs.version.outputs.short_sha }}"

          case "$BRANCH" in
            master)
              BASE_TAGS="${VERSION_MAJOR} ${VERSION_MINOR} ${VERSION_FULL} latest stable"
              ;;
            staging)
              BASE_TAGS="${VERSION_MAJOR}-beta ${VERSION_MINOR}-beta ${VERSION_FULL}-beta staging beta"
              ;;
            develop)
              BASE_TAGS="develop alpha alpha.${SHORT_SHA}"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for Docker publishing. Use master, staging, or develop."
              exit 1
              ;;
          esac

          for TAG in $BASE_TAGS; do
            docker manifest create "${IMAGE}:${TAG}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
            docker manifest push "${IMAGE}:${TAG}"
          done

  github-release:
    name: Create GitHub Release
    needs: [version, build-cli-binaries]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: patr-*
          merge-multiple: true
          path: artifacts

      - name: Write version.txt
        working-directory: artifacts
        run: echo "${{ needs.version.outputs.build_version }}" > version.txt

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          for file in *; do
            sha256sum "$file" > "${file}.sha256sum"
          done

      - name: Compute release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION="${{ needs.version.outputs.full }}"
          SHORT_SHA="${{ needs.version.outputs.short_sha }}"
          BETA_NUM="${{ needs.version.outputs.beta_num }}"

          case "$BRANCH" in
            master)
              TAG="v${VERSION}"
              PRERELEASE=false
              NAME="Patr CLI v${VERSION}"
              ;;
            staging)
              TAG="v${VERSION}-beta.${BETA_NUM}"
              PRERELEASE=true
              NAME="Patr CLI v${VERSION}-beta.${BETA_NUM}"
              ;;
            develop)
              TAG="alpha"
              PRERELEASE=true
              NAME="Patr CLI Alpha (${SHORT_SHA})"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for publishing."
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Force-update tag to current commit
        if: github.ref_name == 'develop'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Delete existing release assets
        if: github.ref_name == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | while read -r ASSET; do
            gh release delete-asset "$TAG" "$ASSET" --yes
          done || true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: ${{ github.ref_name != 'develop' }}
          body: ${{ github.ref_name == 'develop' && format('Rolling alpha build from commit {0}', github.sha) || '' }}
          make_latest: ${{ github.ref_name == 'master' }}
          files: artifacts/*

  update-homebrew-tap:
    name: Update Homebrew formula
    needs: [version, github-release, build-cli-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compute release tag and formula
        id: brew
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION="${{ needs.version.outputs.full }}"
          TAG="${{ needs.github-release.outputs.tag }}"

          case "$BRANCH" in
            master)
              FORMULA="cli"
              CLASS="Cli"
              CONFLICTS_A="alpha"
              CONFLICTS_B="beta"
              ;;
            staging)
              FORMULA="beta"
              CLASS="Beta"
              CONFLICTS_A="cli"
              CONFLICTS_B="alpha"
              ;;
            develop)
              FORMULA="alpha"
              CLASS="Alpha"
              CONFLICTS_A="cli"
              CONFLICTS_B="beta"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for publishing."
              exit 1
              ;;
          esac

          # Reuse the same semver string the binary itself carries.
          BREW_VERSION="${{ needs.version.outputs.build_version }}"

          echo "brew_version=$BREW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "formula=$FORMULA" >> "$GITHUB_OUTPUT"
          echo "class=$CLASS" >> "$GITHUB_OUTPUT"
          echo "conflicts_a=$CONFLICTS_A" >> "$GITHUB_OUTPUT"
          echo "conflicts_b=$CONFLICTS_B" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts and compute checksums
        uses: actions/download-artifact@v8
        with:
          pattern: patr-*
          merge-multiple: true
          path: /tmp/assets

      - name: Compute checksums
        id: shas
        # Homebrew installs the `-brew` variants (built with
        # `--features no-self-update`), so hash those, not the standard ones.
        run: |
          echo "linux_amd64=$(sha256sum /tmp/assets/patr-linux-amd64-brew.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum /tmp/assets/patr-linux-arm64-brew.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_arm64=$(sha256sum /tmp/assets/patr-darwin-arm64-brew.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate and push formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.github-release.outputs.tag }}"
          VERSION="${{ steps.brew.outputs.brew_version }}"
          FORMULA="${{ steps.brew.outputs.formula }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          cp assets/cli/homebrew/formula.rb /tmp/formula.rb
          sed -i "s|{{CLASS}}|${{ steps.brew.outputs.class }}|g" /tmp/formula.rb
          sed -i "s|{{VERSION}}|${VERSION}|g" /tmp/formula.rb
          sed -i "s|{{CONFLICTS_A}}|${{ steps.brew.outputs.conflicts_a }}|g" /tmp/formula.rb
          sed -i "s|{{CONFLICTS_B}}|${{ steps.brew.outputs.conflicts_b }}|g" /tmp/formula.rb
          sed -i "s|{{BASE_URL}}|${BASE_URL}|g" /tmp/formula.rb
          sed -i "s|{{SHA_DARWIN_ARM64}}|${{ steps.shas.outputs.darwin_arm64 }}|g" /tmp/formula.rb
          sed -i "s|{{SHA_LINUX_ARM64}}|${{ steps.shas.outputs.linux_arm64 }}|g" /tmp/formula.rb
          sed -i "s|{{SHA_LINUX_AMD64}}|${{ steps.shas.outputs.linux_amd64 }}|g" /tmp/formula.rb

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/patr-cloud/homebrew-cli.git" /tmp/homebrew-cli
          mkdir -p /tmp/homebrew-cli/Formula
          cp /tmp/formula.rb "/tmp/homebrew-cli/Formula/${FORMULA}.rb"

          cd /tmp/homebrew-cli
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA}.rb"
          git commit -m "Update ${FORMULA} formula to ${TAG}" || echo "No changes to commit"
          git push
