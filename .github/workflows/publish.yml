name: Docker Publish

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^package.version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Compute Docker tags
        id: tags
        run: |
          IMAGE="patrcloud/${{ matrix.image }}"
          BRANCH="${{ github.ref_name }}"
          VERSION_FULL="${{ steps.version.outputs.full }}"
          VERSION_MINOR="${{ steps.version.outputs.minor }}"
          VERSION_MAJOR="${{ steps.version.outputs.major }}"

          case "$BRANCH" in
            master)
              TAGS="${IMAGE}:${VERSION_MAJOR},${IMAGE}:${VERSION_MINOR},${IMAGE}:${VERSION_FULL},${IMAGE}:latest,${IMAGE}:stable"
              ;;
            staging)
              TAGS="${IMAGE}:${VERSION_MAJOR}-beta,${IMAGE}:${VERSION_MINOR}-beta,${IMAGE}:${VERSION_FULL}-beta,${IMAGE}:staging,${IMAGE}:beta"
              ;;
            develop)
              TAGS="${IMAGE}:develop,${IMAGE}:alpha"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for Docker publishing. Use master, staging, or develop."
              exit 1
              ;;
          esac

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
