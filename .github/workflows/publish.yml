name: Docker Publish

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [api, frontend]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-latest-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^package.version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Compute Docker tags
        id: tags
        run: |
          IMAGE="patrcloud/${{ matrix.image }}"
          BRANCH="${{ github.ref_name }}"
          VERSION_FULL="${{ steps.version.outputs.full }}"
          VERSION_MINOR="${{ steps.version.outputs.minor }}"
          VERSION_MAJOR="${{ steps.version.outputs.major }}"
          ARCH="${{ matrix.arch }}"

          case "$BRANCH" in
            master)
              TAGS="${IMAGE}:${VERSION_MAJOR}-${ARCH},${IMAGE}:${VERSION_MINOR}-${ARCH},${IMAGE}:${VERSION_FULL}-${ARCH},${IMAGE}:latest-${ARCH},${IMAGE}:stable-${ARCH}"
              ;;
            staging)
              TAGS="${IMAGE}:${VERSION_MAJOR}-beta-${ARCH},${IMAGE}:${VERSION_MINOR}-beta-${ARCH},${IMAGE}:${VERSION_FULL}-beta-${ARCH},${IMAGE}:staging-${ARCH},${IMAGE}:beta-${ARCH}"
              ;;
            develop)
              TAGS="${IMAGE}:develop-${ARCH},${IMAGE}:alpha-${ARCH}"
              ;;
            *)
              echo "::error::Branch '$BRANCH' is not allowed for Docker publishing. Use master, staging, or develop."
              exit 1
              ;;
          esac

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  manifest:
    name: Multi-arch manifest for ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^package.version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          IMAGE="patrcloud/${{ matrix.image }}"
          BRANCH="${{ github.ref_name }}"
          VERSION_FULL="${{ steps.version.outputs.full }}"
          VERSION_MINOR="${{ steps.version.outputs.minor }}"
          VERSION_MAJOR="${{ steps.version.outputs.major }}"

          case "$BRANCH" in
            master)
              BASE_TAGS="${VERSION_MAJOR} ${VERSION_MINOR} ${VERSION_FULL} latest stable"
              ;;
            staging)
              BASE_TAGS="${VERSION_MAJOR}-beta ${VERSION_MINOR}-beta ${VERSION_FULL}-beta staging beta"
              ;;
            develop)
              BASE_TAGS="develop alpha"
              ;;
          esac

          for TAG in $BASE_TAGS; do
            docker manifest create "${IMAGE}:${TAG}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
            docker manifest push "${IMAGE}:${TAG}"
          done
