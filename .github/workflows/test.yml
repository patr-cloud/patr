name: CI Tests

on:
  pull_request:
    branches: [develop, staging, master]

# Cancel in-progress runs for the same ref
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format-check:
    name: Format & Static Checks
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - name: Generate TS bindings
        run: cargo bindings

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm typecheck
        working-directory: frontend

      - run: pnpm lint:check
        working-directory: frontend

      - run: pnpm format:check
        working-directory: frontend

  unit-tests:
    name: Unit Tests (common)
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Setup frontend public folder
        run: mkdir -p frontend/.output/public

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - run: cargo nextest run --package common

  build:
    name: Build API + bindings
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      # `common` embeds this folder via #[derive(RustEmbed)]; the build fails if
      # it doesn't exist.
      - name: Setup frontend public folder
        run: mkdir -p frontend/.output/public

      - name: Build api binary
        run: cargo build --package api

      # Built in a separate cargo invocation from `api`: compiling both in one
      # invocation unifies `common`'s features and fails to compile. The @docker
      # e2e suite spawns this binary (target/debug/docker) as the real runner.
      - name: Build docker runner binary
        run: cargo build --package docker

      - name: Generate TS bindings
        run: cargo bindings

      - name: Upload api binary
        uses: actions/upload-artifact@v4
        with:
          name: api-binary
          path: target/debug/api
          retention-days: 1
          if-no-files-found: error

      - name: Upload docker runner binary
        uses: actions/upload-artifact@v4
        with:
          name: runner-binary
          path: target/debug/docker
          retention-days: 1
          if-no-files-found: error

      - name: Upload TS bindings
        uses: actions/upload-artifact@v4
        with:
          name: ts-bindings
          path: frontend/src/bindings
          retention-days: 1
          if-no-files-found: error

  integration-tests:
    name: Integration Tests (api)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Setup frontend public folder
        run: mkdir -p frontend/.output/public

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,nextest

      - run: just --justfile api/tests/Justfile test

  conformance-tests:
    name: OCI Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Setup frontend public folder
        run: mkdir -p frontend/.output/public

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # Boots the registry conformance harness and runs the official OCI
      # distribution-spec suite against it; fails on any conformance regression.
      - run: just --justfile api/tests/Justfile conformance

      - name: Upload conformance report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oci-conformance-report
          path: api/tests/registry/conformance-results
          retention-days: 7

  ui-tests:
    name: UI Tests (e2e)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BIN: ${{ github.workspace }}/target/debug/api
      TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v6

      - name: Download api binary
        uses: actions/download-artifact@v4
        with:
          name: api-binary
          path: target/debug

      - name: Download TS bindings
        uses: actions/download-artifact@v4
        with:
          name: ts-bindings
          path: frontend/src/bindings

      - name: Make api binary executable
        run: chmod +x "$API_BIN"

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v5
        with:
          path: |
            e2e/node_modules
            frontend/node_modules
            ~/.local/share/pnpm/store
          key: pnpm-e2e-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml', 'frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-e2e-${{ runner.os }}-

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install e2e + frontend deps and browsers
        run: just install
        working-directory: e2e

      - name: Bring up external deps
        run: just up
        working-directory: e2e

      - name: Run UI suite
        run: just test --project=default
        working-directory: e2e

      - name: Tear down
        if: always()
        run: just down
        working-directory: e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          # playwright-report holds the HTML report (which embeds failure
          # traces); test-results holds the raw trace.zip/screenshots as a
          # fallback if the report step itself died.
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker-tests:
    name: Docker Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        docker: ["26", "27", "28", "29"]
    env:
      DOCKER_VERSIONS: ${{ matrix.docker }}
      API_BIN: ${{ github.workspace }}/target/debug/api
    steps:
      - uses: actions/checkout@v6

      - name: Download api binary
        uses: actions/download-artifact@v4
        with:
          name: api-binary
          path: target/debug

      - name: Download docker runner binary
        uses: actions/download-artifact@v4
        with:
          name: runner-binary
          path: target/debug

      - name: Download TS bindings
        uses: actions/download-artifact@v4
        with:
          name: ts-bindings
          path: frontend/src/bindings

      - name: Make binaries executable
        run: chmod +x "$API_BIN" "${{ github.workspace }}/target/debug/docker"

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v5
        with:
          path: |
            e2e/node_modules
            frontend/node_modules
            ~/.local/share/pnpm/store
          key: pnpm-e2e-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml', 'frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-e2e-${{ runner.os }}-

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install e2e + frontend deps and browsers
        run: just install
        working-directory: e2e

      - name: Bring up external deps
        run: just up
        working-directory: e2e

      - name: Run @docker suite (Docker ${{ matrix.docker }})
        run: just test --project=docker-${{ matrix.docker }}
        working-directory: e2e

      - name: Tear down
        if: always()
        run: just down
        working-directory: e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-docker-${{ matrix.docker }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  cli-check:
    name: Cargo CLI check
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      # `cli` pulls in `common`, which embeds this folder via #[derive(RustEmbed)].
      - name: Setup frontend public folder
        run: mkdir -p frontend/.output/public

      - name: Check cli
        run: cargo check --package cli

  ingress-check:
    name: Cargo ingress check
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Setup frontend public folder
        run: mkdir -p frontend/.output/public

      - name: Check ingress
        run: cargo check --package ingress

  ci-green:
    name: CI Green
    needs:
      [
        format-check,
        unit-tests,
        build,
        integration-tests,
        conformance-tests,
        cli-check,
        ingress-check,
        ui-tests,
        docker-tests,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.format-check.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.conformance-tests.result }}" != "success" ] || \
             [ "${{ needs.cli-check.result }}" != "success" ] || \
             [ "${{ needs.ingress-check.result }}" != "success" ] || \
             [ "${{ needs.ui-tests.result }}" != "success" ] || \
             [ "${{ needs.docker-tests.result }}" != "success" ]; then
            echo "format-check:      ${{ needs.format-check.result }}"
            echo "unit-tests:        ${{ needs.unit-tests.result }}"
            echo "build:             ${{ needs.build.result }}"
            echo "integration-tests: ${{ needs.integration-tests.result }}"
            echo "conformance-tests: ${{ needs.conformance-tests.result }}"
            echo "cli-check:         ${{ needs.cli-check.result }}"
            echo "ingress-check:     ${{ needs.ingress-check.result }}"
            echo "ui-tests:          ${{ needs.ui-tests.result }}"
            echo "docker-tests:      ${{ needs.docker-tests.result }}"
            echo "One or more jobs did not pass."
            exit 1
          fi
          echo "All jobs passed."

  # SQLx offline data stays verified on staging/master PRs only.
  sqlx-check:
    name: SQLx Offline Check
    runs-on: ubuntu-latest
    if: github.base_ref == 'staging' || github.base_ref == 'master'
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: api
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Build API binary
        run: cargo build --package api
        env:
          SQLX_OFFLINE: "true"

      - name: Run API to initialize DB schema
        run: timeout 30 ./target/debug/api || true
        env:
          PATR_DATABASE_HOST: localhost
          PATR_REDIS_HOST: localhost

      - name: Verify sqlx offline data
        run: cargo sqlx prepare --check --workspace
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/api
