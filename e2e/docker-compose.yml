services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 30

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/test-config.yaml
    volumes:
      - ./config/loki-config.yaml:/etc/loki/test-config.yaml:ro
    ports:
      - "13100:3100"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --quiet --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"
      interval: 1s
      timeout: 3s
      retries: 60

  mimir:
    image: grafana/mimir:2.13.0
    command: -config.file=/etc/mimir/test-config.yaml
    volumes:
      - ./config/mimir-config.yaml:/etc/mimir/test-config.yaml:ro
    ports:
      - "18080:8080"
