multitenancy_enabled: true
target: all
server:
  http_listen_address: "0.0.0.0"
  http_listen_port: 8080
ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
    replication_factor: 1
distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
ruler:
  ring:
    kvstore:
      store: inmemory
ruler_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/rules
alertmanager:
  data_dir: /tmp/mimir/am-data
  external_url: http://localhost
  sharding_ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/alertmanager
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/blocks
  bucket_store:
    sync_dir: /tmp/mimir/tsdb-sync
  tsdb:
    dir: /tmp/mimir/tsdb
compactor:
  data_dir: /tmp/mimir/compactor
  sharding_ring:
    kvstore:
      store: inmemory
store_gateway:
  sharding_ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
    replication_factor: 1
