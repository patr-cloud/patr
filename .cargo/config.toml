[alias]
api           = "run -p api"
bindings      = "test -p models export_bindings"
docker        = "run -p docker"
new-migration = "run -p api --example new_migration --"
patr          = "run -p cli --"
# sqlx prepare is wrapped by the workspace Justfile — `just prepare`
# (self-hosted) and `just prepare-cloud`. The wrapper needs to move query
# files into a feature-specific subdir after sqlx writes them, which a cargo
# alias can't express.

[env]
TS_RS_EXPORT_DIR = { value = "frontend/src/bindings", relative = true }

[build]
rustflags = ["--cfg", "tokio_unstable"]

[target.'cfg(target_arch = "wasm32")']
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
