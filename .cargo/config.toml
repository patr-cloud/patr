[alias]
api      = "run -p api"
bindings = "test -p models export_bindings"
docker   = "run -p docker"
patr     = "run -p cli --"
prepare  = "sqlx prepare --workspace"

[env]
TS_RS_EXPORT_DIR = { value = "frontend/src/bindings", relative = true }

[build]
rustflags = ["--cfg", "tokio_unstable"]

[target.'cfg(target_arch = "wasm32")'.build]
rustflags = ["-cfg", "getrandom_backend=wasm_js"]
